name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  pr-body:
    # A draft PR has no Verdict item yet, so its run is renamed instead of failing. It is not
    # skipped under the required name: branch protection counts a skipped `pr-body` as passed.
    # With no `pr-body` run on the head, the required check waits until ready_for_review runs it.
    name: ${{ github.event.pull_request.draft && 'pr-body (draft, runs when ready)' || 'pr-body' }}
    runs-on: ubuntu-latest
    env:
      # The full ref: git resolves a short `origin/main` to a tag of that name first, and a
      # pushed tag must not pick the gate scripts or the base the tier is measured against.
      BASE_REF: refs/remotes/origin/${{ github.event.pull_request.base.ref }}
    steps:
      - if: github.event.pull_request.draft
        run: echo "Draft PR; pr-body runs when it is marked ready for review."
      # The PR head, not the default merge ref: against a moved base the merge ref can hide
      # changes and compute a lower tier than review-tier.py does on the author's branch.
      - if: ${{ !github.event.pull_request.draft }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: head
          persist-credentials: false
      # A PR must not judge itself with its own edited gate: the check runs the base branch's
      # copy of the gate scripts against the head checkout. The copy lives outside `head`
      # because review-tier.py counts untracked files in the checkout as changes.
      - name: Copy the base branch's gate scripts
        if: ${{ !github.event.pull_request.draft }}
        shell: bash
        run: |
          mkdir gate
          git -C head archive "$BASE_REF" scripts package.json package-lock.json | tar -x -C gate
          echo "The gate scripts at $BASE_REF ($(git -C head rev-parse --short "$BASE_REF")) judge this PR."
          merge_base="$(git -C head merge-base HEAD "$BASE_REF")"
          changed="$(git -C head diff --name-only "$merge_base" HEAD -- scripts/review-tier.py scripts/check-pr-body.py scripts/same-code.mjs | paste -sd ' ' -)"
          if [ -n "$changed" ]; then
            echo "::notice title=pr-body::This PR changes the review gate ($changed); the base branch's copy judges this PR, and the PR's own version applies after merge."
          fi
      # review-tier.py compares JavaScript through node and espree.
      - if: ${{ !github.event.pull_request.draft }}
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: gate/package-lock.json
      - if: ${{ !github.event.pull_request.draft }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The base branch's lock installs the base's espree into `gate`, and --ignore-scripts keeps
      # package install scripts from running; the head's packages are never installed.
      - if: ${{ !github.event.pull_request.draft }}
        working-directory: gate
        run: npm ci --ignore-scripts
      - name: Check the Review section
        if: ${{ !github.event.pull_request.draft }}
        working-directory: head
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 ../gate/scripts/check-pr-body.py "$BASE_REF"
