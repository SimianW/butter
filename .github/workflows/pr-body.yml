name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  pr-body:
    # A draft PR has no Verdict item yet, so its run is renamed instead of failing. It is not
    # skipped under the required name: branch protection counts a skipped `pr-body` as passed.
    # With no `pr-body` run on the head, the required check waits until ready_for_review runs it.
    name: ${{ github.event.pull_request.draft && 'pr-body (draft, runs when ready)' || 'pr-body' }}
    runs-on: ubuntu-latest
    steps:
      - if: github.event.pull_request.draft
        run: echo "Draft PR; pr-body runs when it is marked ready for review."
      # The PR head, not the default merge ref: against a moved base the merge ref can hide
      # changes and compute a lower tier than review-tier.py does on the author's branch.
      - if: ${{ !github.event.pull_request.draft }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # review-tier.py compares JavaScript through node and espree, so the check needs npm ci.
      - if: ${{ !github.event.pull_request.draft }}
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - if: ${{ !github.event.pull_request.draft }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - if: ${{ !github.event.pull_request.draft }}
        run: npm ci
      - name: Check the Review section
        if: ${{ !github.event.pull_request.draft }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: python3 scripts/check-pr-body.py "$BASE_REF"
