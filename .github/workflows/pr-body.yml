name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-body:
    runs-on: ubuntu-latest
    steps:
      # The PR head, not the default merge ref: against a moved base the merge ref can hide
      # changes and compute a lower tier than review-tier.py does on the author's branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check review tier and review lines
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: python3 scripts/check-pr-body.py "$BASE_REF"
