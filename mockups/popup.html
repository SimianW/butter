<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Butter popup mockup</title>
<style>
  :root { --ui: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  body { margin: 0; font-family: var(--ui); padding: 32px; background: #ecebe7; color: #333; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lede { font-size: 13px; opacity: .7; margin: 0 0 24px; }
  h2 { font-size: 14px; margin: 28px 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  .cap { font-size: 12px; opacity: .7; margin-bottom: 8px; }

  .popup {
    --bg: #fffaeb; --surface: #fff3c9; --surface-2: #ffffff; --ink: #3d2b12; --muted: #8c7550;
    --line: rgb(120 84 20 / .14); --accent: #f5c842; --icon: #c08a12; --knob: #fff; --track-off: #e7dcc2;
    --seg: #f3ead2;
    --ok: #3f8a3a; --ok-bg: #e6f2dc; --fail: #c24a12; --fail-bg: #fde3d3;
    --wait: #8c7550; --wait-bg: #f3ead2; --off: #a69a85; --off-bg: #efebe2;
    width: 320px; background: var(--bg); color: var(--ink); font-family: var(--ui);
    font-size: 13px; border-radius: 10px; overflow: hidden;
    box-shadow: 0 10px 30px rgb(0 0 0 / .14), 0 0 0 1px rgb(0 0 0 / .06);
  }
  .popup.dark {
    --bg: #241a10; --surface: #36281a; --surface-2: #2d2116; --ink: #f6e6c6;
    --muted: #b49b74; --line: rgb(246 230 198 / .1); --accent: #e3a344; --icon: #e8b45c;
    --knob: #fff6e0; --track-off: #4a3a28; --seg: #3a2b1c;
    --ok: #9ccf86; --ok-bg: rgb(156 207 134 / .14); --fail: #ff9a66; --fail-bg: rgb(255 154 102 / .15);
    --wait: #c9b28a; --wait-bg: rgb(201 178 138 / .13); --off: #8d7d66; --off-bg: rgb(141 125 102 / .14);
  }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; display: block; }

  .hd { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
  .hd img { width: 40px; height: 40px; }
  .hd .name { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .hd .ver { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 1px; }

  .card { margin: 0 12px; padding: 14px; border-radius: 12px; background: var(--surface);
    display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .card .badge { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: var(--bg); color: var(--icon); flex: none; }
  .card .badge svg.i { width: 18px; height: 18px; }
  .card .big { font-size: 14.5px; font-weight: 650; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card .chev { margin-left: auto; color: var(--muted); }
  .card.warn { background: var(--fail-bg); }
  .card.warn .big, .card.warn .badge { color: var(--fail); }
  .card.muted { background: var(--off-bg); }
  .card.muted .badge { color: var(--muted); }

  .sw-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
  .sw-row .lbl { font-weight: 600; }
  .sw-row .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .switch { width: 36px; height: 21px; border-radius: 999px; background: var(--track-off); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px;
    border-radius: 50%; background: var(--knob); box-shadow: 0 1px 2px rgb(0 0 0 / .25); }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 17px; }
  .switch.sm { width: 30px; height: 18px; }
  .switch.sm::after { width: 14px; height: 14px; }
  .switch.sm.on::after { left: 14px; }
  .switch.dim { opacity: .45; }

  .ft { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 12px 16px;
    border-top: 1px solid var(--line); font-size: 12px; }
  .ft a { color: var(--ink); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
  .ft a svg.i { width: 14px; height: 14px; }
  .ft .links { display: flex; gap: 12px; }
  .ft .links a { color: var(--muted); font-weight: 500; gap: 4px; }
  .ft .links a svg.i { width: 13px; height: 13px; }

  .bar { display: flex; align-items: center; gap: 4px; padding: 12px 12px 8px; }
  .bar .back { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
  .bar .back svg.i { width: 18px; height: 18px; }
  .bar .title { font-size: 15px; font-weight: 700; }
  .sec { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    padding: 12px 16px 6px; }
  .tally { display: flex; gap: 6px; padding: 0 16px 10px; flex-wrap: wrap; }
  .list { margin: 0 12px; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); }
  .item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; }
  .item + .item { border-top: 1px solid var(--line); }
  .item .txt { flex: 1; min-width: 0; }
  .item .n { font-weight: 650; font-size: 13px; }
  .item .d { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .item .stat { margin-top: 5px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
    padding: 2px 7px 2px 5px; border-radius: 999px; white-space: nowrap; }
  .chip svg.i { width: 12px; height: 12px; stroke-width: 2.25; }
  .chip.ok { color: var(--ok); background: var(--ok-bg); }
  .chip.fail { color: var(--fail); background: var(--fail-bg); }
  .chip.wait { color: var(--wait); background: var(--wait-bg); }
  .chip.off, .chip.paused { color: var(--off); background: var(--off-bg); }
  .note { font-size: 11.5px; color: var(--muted); padding: 8px 16px 0; line-height: 1.45; }
  .banner { margin: 0 12px 10px; padding: 9px 11px; border-radius: 10px; background: var(--off-bg);
    color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: flex-start; line-height: 1.4; }
  .banner svg.i { margin-top: 1px; }
  .lang { margin: 0 12px 14px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 12px; display: flex; align-items: center; gap: 8px; }
  .lang > svg.i { color: var(--icon); }
  .lang .lbl { font-weight: 650; flex: 1; }
  .seg { display: flex; background: var(--seg); border-radius: 8px; padding: 2px; }
  .seg span { padding: 3px 10px; border-radius: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .seg span.on { background: var(--accent); color: #3d2b12; }
</style>
</head>
<body>

const CHIP_ICON = { ok: "ok", fail: "fail", wait: "wait", off: "off", paused: "pause" };
const chip = (t, k, text) => `<span class="chip ${k}">${svg(CHIP_ICON[k])}${text ?? t.chip[k]}</span>`;

const head = () => `<div class="hd"><img src="${ICON}" alt=""><div><div class="name">Butter</div><div class="ver">0.1.0-alpha.8</div></div></div>`;
const foot = t => `<div class="ft"><a href="#">${t.settings}${svg("right")}</a>
  <span class="links"><a href="#">${svg("log")}${t.changelog}</a><a href="#">${svg("ext")}GitHub</a></span></div>`;

function home(t, kind) {
  const cls = { ok: "", warn: "warn", paused: "muted", away: "muted" }[kind];
  const ic = { ok: "sparkles", warn: "alert", paused: "pause", away: "chat" }[kind];
  const [big, sub] = t.cards[kind];
  const on = kind !== "paused";
  return `${head()}<div class="card ${cls}"><span class="badge">${svg(ic)}</span><div><div class="big">${big}</div><div class="sub">${sub}</div></div><span class="chev">${svg("right")}</span></div>
    <div class="sw-row"><div><div class="lbl">${t.enable}</div><div class="hint">${on ? t.hintOn : t.hintOff}</div></div>
    <span class="switch ${on ? "on" : ""}"></span></div>${foot(t)}`;
}

function settings(t, lang, states, paused) {
  const counts = {};
  states.forEach(s => counts[s] = (counts[s] || 0) + 1);
  const tally = paused ? "" : `<div class="tally">${["ok","wait","fail","off"].filter(k => counts[k])
    .map(k => chip(t, k, `${counts[k]} ${t.chip[k]}`)).join("")}</div>`;
  const banner = paused ? `<div class="banner">${svg("pause")}<span>${t.banner}</span></div>` : "";
  const rows = t.items.map(([n, d], i) => {
    const s = paused ? "paused" : states[i];
    const on = states[i] !== "off";
    return `<div class="item"><div class="txt"><div class="n">${n}</div><div class="d">${d}</div>
      <div class="stat">${chip(t, s)}</div></div>
      <span class="switch sm ${on ? "on" : ""} ${paused ? "dim" : ""}"></span></div>`;
  }).join("");
  return `<div class="bar"><span class="back">${svg("left")}</span><span class="title">${t.settings}</span></div>
    ${tally}${banner}<div class="list">${rows}</div>
    ${paused ? "" : `<div class="note">${t.note}</div>`}
    <div class="sec">${t.general}</div>
    <div class="lang">${svg("lang")}<span class="lbl">${t.language}</span>
      <span class="seg"><span class="${lang === "en" ? "on" : ""}">English</span><span class="${lang === "zh" ? "on" : ""}">中文</span></span></div>`;
}

const panels = [
  ["Home · all working", () => home(T.en, "ok")],
  ["Home · one broken", () => home(T.en, "warn")],
  ["Home · paused", () => home(T.en, "paused")],

  ["Settings · mixed states", () => settings(T.en, "en", ["ok", "ok", "wait", "fail", "off"], false)],
