<!doctype html>
<!--
  One case per page reader rule that the other pages leave open (extension/page/reader.js).
  - Turn 1, which id wins: the role wrapper carries both data-message-id and a different
    data-chatgpt-selection-message-id; the answer's id is the data-message-id (idOf's order).
  - Turn 2, the id needs the assistant role: a non-role [data-message-id] wrapper sits between the
    answer root and the assistant role wrapper; it must not supply the answer's id (MESSAGE).
  - Turn 3, the question is the keyed turn's: a keyed turn holds an inner article /
    conversation-turn-N wrapper, which has no data-turn-key; the answer's question is the outer
    turn's key (turnKeyOf reads [data-turn-key] only), while its loose turn is the inner wrapper.
  - Turn 4, a bare article: ChatGPT's oldest turn wrapper, with neither a turn key nor a test id,
    is still a loose turn (looseTurnOf), and its answer is in no keyed turn.
  The message ids in turns 1 to 3 agree with seek's turnMessageId (page/reader-main.js),
  which takes the turn's first assistant role wrapper's data-message-id, else its first
  data-chatgpt-selection-message-id.
-->
<html>
  <head>
    <title>Rules</title>
  </head>
  <body>
    <header><span>Header text outside every turn</span></header>
    <main>
      <div class="thread-scroll-container">
        <div>
          <article data-turn-key="q-rule-1" data-testid="conversation-turn-1" data-expect-loose-turn>
            <div class="user"><div data-user-message-bubble data-expect-preview-item>Which id wins?</div></div>
            <div
              data-message-author-role="assistant"
              data-message-id="a-rule-1"
              data-chatgpt-selection-message-id="a-rule-1-selection"
              data-expect-reply
            >
              <div
                data-markdown-text-style="assistant-message"
                class="markdown prose"
                data-expect-answer="a-rule-1"
                data-expect-question="q-rule-1"
                data-expect-reply
              >
                <p data-expect-para="0" data-expect-preview-item data-expect-block>The message id.</p>
              </div>
            </div>
          </article>
        </div>
        <div>
          <article data-turn-key="q-rule-2" data-testid="conversation-turn-2" data-expect-loose-turn>
            <div class="user"><div data-user-message-bubble data-expect-preview-item>And without a role?</div></div>
            <div data-message-author-role="assistant" data-message-id="a-rule-2" data-expect-reply>
              <div class="message-wrapper" data-message-id="not-an-answer-id">
                <div
                  data-markdown-text-style="assistant-message"
                  class="markdown prose"
                  data-expect-answer="a-rule-2"
                  data-expect-question="q-rule-2"
                  data-expect-reply
                >
                  <p data-expect-para="0" data-expect-preview-item data-expect-block>The role wrapper's id.</p>
                </div>
              </div>
            </div>
          </article>
        </div>
        <div data-turn-key="q-rule-3" data-expect-loose-turn>
          <article data-testid="conversation-turn-3" data-expect-loose-turn>
            <div class="user"><div data-user-message-bubble data-expect-preview-item>Whose key?</div></div>
            <div data-chatgpt-selection-conversation-id="c-rule" data-chatgpt-selection-message-id="a-rule-3">
              <div
                data-markdown-text-style="assistant-message"
                class="markdown prose"
                data-expect-answer="a-rule-3"
                data-expect-question="q-rule-3"
                data-expect-reply
              >
                <p data-expect-para="0" data-expect-preview-item data-expect-block>The outer turn's key.</p>
              </div>
            </div>
          </article>
        </div>
        <div>
          <article data-expect-loose-turn>
            <div data-message-author-role="user" data-message-id="q-rule-4">
              <div data-user-message-bubble data-expect-preview-item>A bare article.</div>
            </div>
            <div data-message-author-role="assistant" data-message-id="a-rule-4" data-expect-reply>
              <div
                data-markdown-text-style="assistant-message"
                class="markdown prose"
                data-expect-answer="a-rule-4"
                data-expect-reply
              >
                <p data-expect-para="0" data-expect-preview-item data-expect-block>Still a loose turn.</p>
              </div>
            </div>
          </article>
        </div>
      </div>
    </main>
    <div class="disclaimer"><span>ChatGPT can make mistakes. Check important info.</span></div>
  </body>
</html>
